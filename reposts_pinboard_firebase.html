<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reposts ♡</title>

<style>
:root{
  --pink:#f6dbe5;
  --pink-deep:#d99aaa;
  --pink-soft:#fff5f8;
  --white:#ffffff;
  --cream:#fffafb;
  --text:#6b505b;
  --muted:#a88e98;
  --line:#efdce3;
  --shadow:0 10px 30px rgba(164,112,132,.10);
  --shadow-hover:0 14px 35px rgba(164,112,132,.15);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 5%,rgba(246,219,229,.55),transparent 25%),
    radial-gradient(circle at 90% 10%,rgba(255,239,245,.8),transparent 25%),
    linear-gradient(180deg,#fff8fa 0%,#fff 55%,#fff9fb 100%);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

button:hover{
  transform:translateY(-1px);
}

.page{
  max-width:1180px;
  margin:auto;
  padding:34px 24px 80px;
}

header{
  margin-bottom:42px;
}

h1{
  margin:0;
  font-size:38px;
  line-height:1;
  font-weight:500;
  letter-spacing:-.5px;
}

.subtitle{
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.2px;
}

.admin-btn{
  position:fixed;
  top:18px;
  right:20px;
  z-index:1000;
  border:1px solid var(--line);
  background:rgba(255,255,255,.92);
  border-radius:999px;
  padding:9px 15px;
  color:var(--text);
  cursor:pointer;
  box-shadow:var(--shadow);
  white-space:nowrap;
}

.admin-btn:hover{
  background:var(--pink-soft);
}

.admin-panel{
  display:none;
  background:rgba(255,255,255,.95);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  margin:0 0 30px;
  box-shadow:var(--shadow);
}

.admin-panel.open{
  display:block;
}

.admin-panel h2{
  margin:0 0 16px;
  font-size:21px;
  font-weight:500;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin:0 0 6px;
  color:var(--muted);
  font-size:12px;
}

input,
textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fffafd;
  border-radius:13px;
  padding:11px 13px;
  outline:none;
  color:var(--text);
}

input:focus,
textarea:focus{
  border-color:#e3b7c5;
  box-shadow:0 0 0 3px rgba(246,219,229,.35);
}

textarea{
  min-height:78px;
  resize:vertical;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.primary,
.secondary,
.delete,
.edit,
.save,
.cancel,
.history-btn,
.clear-history{
  border-radius:999px;
  padding:9px 15px;
  cursor:pointer;
}

.primary{
  border:1px solid #eac3cf;
  background:var(--pink);
  color:var(--text);
}

.secondary{
  border:1px solid var(--line);
  background:var(--pink-soft);
  color:var(--text);
}

.delete{
  border:1px solid #f0d5dc;
  background:#fff3f5;
  color:#a05d6d;
}

.status{
  font-size:12px;
  color:var(--muted);
  margin-top:10px;
  min-height:16px;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin:13px 0 0;
}


/* =========================================
   REPOST GRID
========================================= */

.grid{
  columns:3 320px;
  column-gap:28px;
}

.card{
  break-inside:avoid;
  margin-bottom:28px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 12px 16px;
  box-shadow:var(--shadow);
  overflow:visible;
  position:relative;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.card:nth-child(3n+1){ transform:rotate(-1.4deg); }
.card:nth-child(3n+2){ transform:rotate(1deg); }
.card:nth-child(3n)  { transform:rotate(-0.5deg); }

.card:hover{
  transform:rotate(0deg) translateY(-3px);
  box-shadow:var(--shadow-hover);
  z-index:2;
}

/* washi tape */
.card::before{
  content:"";
  position:absolute;
  top:-11px;
  left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:64px;
  height:22px;
  background:repeating-linear-gradient(
    45deg,
    var(--pink),
    var(--pink) 6px,
    #f0c3d1 6px,
    #f0c3d1 12px
  );
  opacity:.9;
  box-shadow:0 2px 3px rgba(0,0,0,.08);
  border-radius:1px;
}

.card:nth-child(4n)::before{
  background:repeating-linear-gradient(
    45deg,
    var(--pink-deep),
    var(--pink-deep) 6px,
    #e3a9b6 6px,
    #e3a9b6 12px
  );
  transform:translateX(-50%) rotate(2.5deg);
}


/* =========================================
   INSTAGRAM EMBED
========================================= */

.embed{
  border-radius:13px;
  overflow:hidden;
  background:#fff7fa;
  min-height:180px;
  width:100%;
  min-width:0;
  position:relative;
}

.embed blockquote.instagram-media{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  margin:0 !important;
}


/* =========================================
   CAPTIONS
========================================= */

.caption{
  padding:11px 5px 3px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.caption.empty-caption{
  display:none;
}

.caption-editor{
  margin-top:10px;
  display:none;
}

.admin-on .caption-editor{
  display:block;
}

.caption-editor textarea{
  min-height:62px;
  font-size:13px;
}

.card-actions{
  display:none;
  gap:7px;
  justify-content:flex-end;
  margin-top:10px;
}

.admin-on .card-actions{
  display:flex;
}

.edit{
  border:1px solid var(--line);
  background:#fffafd;
  color:var(--text);
}

.save{
  border:1px solid #eac3cf;
  background:var(--pink);
  color:var(--text);
}

.cancel{
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
}


/* =========================================
   VIEWER HISTORY
========================================= */

.history-section{
  margin-top:30px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.history-header h3{
  margin:0;
  font-size:17px;
  font-weight:500;
}

.history-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.history-btn{
  border:1px solid var(--line);
  background:#fffafd;
  color:var(--text);
}

.clear-history{
  border:1px solid #f0d5dc;
  background:#fff3f5;
  color:#a05d6d;
}

.history-table-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fffafd;
}

.history-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.history-table th{
  text-align:left;
  padding:11px 10px;
  color:var(--muted);
  font-weight:normal;
  background:#fff5f8;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

.history-table td{
  padding:10px;
  border-bottom:1px solid #f3e6eb;
  vertical-align:top;
}

.history-table tr:last-child td{
  border-bottom:0;
}

.history-ip{
  white-space:nowrap;
}

.history-empty{
  text-align:center;
  color:var(--muted);
  padding:25px 15px;
  font-size:13px;
}

.history-small{
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}


/* =========================================
   EMPTY
========================================= */

.empty{
  text-align:center;
  color:var(--muted);
  padding:85px 20px;
  font-size:14px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:1000px){

  .grid{
    columns:2 280px;
  }

}

@media(max-width:760px){

  .grid{
    columns:2 260px;
    column-gap:16px;
  }

  .card{
    margin-bottom:16px;
  }

  .page{
    padding:28px 15px 60px;
  }

  h1{
    font-size:32px;
  }

}

@media(max-width:520px){

  .grid{
    columns:1;
  }

  .card{
    border-radius:6px;
  }

  .admin-btn{
    padding:8px 12px;
    top:12px;
    right:12px;
  }

  .history-table{
    min-width:650px;
  }

}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script async src="https://www.instagram.com/embed.js"></script>

</head>

<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDdnRqRysHijmVJo9lqGHz5Oc7YaigNDow",
  authDomain: "mads-reposts.firebaseapp.com",
  projectId: "mads-reposts",
  storageBucket: "mads-reposts.firebasestorage.app",
  messagingSenderId: "366856299182",
  appId: "1:366856299182:web:0abe419dac4929a134c33f",
  measurementId: "G-LDN3FL4JCM"
};


firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();

const db = firebase.firestore();

const repostsRef =
  db.collection("reposts");

const viewerHistoryRef =
  db.collection("viewerHistory");


/*
  YOUR IP.

  Visits from this IP are NOT saved
  to viewerHistory.
*/

const EXCLUDED_IP =
  "99.229.26.137";


let items = [];


/* =========================================
   STATUS
========================================= */

function status(id,text){

  const element =
    document.getElementById(id);

  if(element){

    element.textContent =
      text;

  }

}


/* =========================================
   NORMALIZE INSTAGRAM URL
========================================= */

function normalizeUrl(raw){

  try{

    const u =
      new URL(raw.trim());


    if(
      !/instagram\.com$/i.test(u.hostname) &&
      !/\.instagram\.com$/i.test(u.hostname)
    ){

      return null;

    }


    return u.href;

  }catch{

    return null;

  }

}


/* =========================================
   ADMIN STATE
========================================= */

function setAdmin(on){

  document.body.classList.toggle(
    "admin-on",
    on
  );


  document.getElementById(
    "loginArea"
  ).style.display =
    on ? "none" : "block";


  document.getElementById(
    "editorArea"
  ).style.display =
    on ? "block" : "none";


  if(on){

    loadViewerHistory();

  }

}


/* =========================================
   LOAD REPOSTS
========================================= */

async function loadReposts(){

  try{

    const snap =
      await repostsRef
        .orderBy("createdAt","desc")
        .get();


    items =
      snap.docs.map(d => ({
        id:d.id,
        ...d.data()
      }));


    render();


  }catch(e){

    console.error(e);


    document.getElementById(
      "empty"
    ).textContent =
      "couldn't load reposts ♡";

  }

}


/* =========================================
   RENDER REPOSTS
========================================= */

function render(){

  const grid =
    document.getElementById("grid");

  const empty =
    document.getElementById("empty");


  grid.innerHTML = "";


  empty.style.display =
    items.length
      ? "none"
      : "block";


  items.forEach(item => {

    const card =
      document.createElement("article");

    card.className =
      "card";


    /* EMBED */

    const embed =
      document.createElement("div");

    embed.className =
      "embed";


    const block =
      document.createElement("blockquote");

    block.className =
      "instagram-media";


    block.setAttribute(
      "data-instgrm-permalink",
      item.url
    );


    block.setAttribute(
      "data-instgrm-version",
      "14"
    );


    block.style.cssText =
      "background:#FFF;" +
      "border:0;" +
      "border-radius:3px;" +
      "box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);" +
      "margin:0;" +
      "max-width:100%;" +
      "min-width:0;" +
      "padding:0;" +
      "width:100%;";


    embed.appendChild(block);

    card.appendChild(embed);


    /* CAPTION */

    const caption =
      document.createElement("div");


    caption.className =
      "caption" +
      (
        item.caption
          ? ""
          : " empty-caption"
      );


    caption.textContent =
      item.caption || "";


    card.appendChild(caption);


    /* EDITOR */

    const editor =
      document.createElement("div");

    editor.className =
      "caption-editor";


    const textarea =
      document.createElement("textarea");


    textarea.value =
      item.caption || "";


    textarea.placeholder =
      "edit caption ♡";


    const editRow =
      document.createElement("div");

    editRow.className =
      "row";

    editRow.style.marginTop =
      "7px";


    /* SAVE */

    const save =
      document.createElement("button");


    save.className =
      "save";


    save.textContent =
      "save caption ♡";


    save.onclick =
      async () => {

        if(!auth.currentUser){

          return;

        }


        save.disabled = true;


        try{

          await repostsRef
            .doc(item.id)
            .update({
              caption:
                textarea.value.trim()
            });


          status(
            "editorStatus",
            "caption updated ♡"
          );


          await loadReposts();


        }catch(e){

          console.error(e);


          status(
            "editorStatus",
            "couldn't update caption ♡"
          );


          save.disabled = false;

        }

      };


    /* CANCEL */

    const cancel =
      document.createElement("button");


    cancel.className =
      "cancel";


    cancel.textContent =
      "cancel";


    cancel.onclick =
      () => {

        textarea.value =
          item.caption || "";


        editor.style.display =
          "none";

      };


    editRow.appendChild(save);

    editRow.appendChild(cancel);


    editor.appendChild(textarea);

    editor.appendChild(editRow);


    card.appendChild(editor);


    /* ACTIONS */

    const actions =
      document.createElement("div");

    actions.className =
      "card-actions";


    /* EDIT */

    const edit =
      document.createElement("button");


    edit.className =
      "edit";


    edit.textContent =
      "edit caption";


    edit.onclick =
      () => {

        editor.style.display =
          editor.style.display === "block"
            ? "none"
            : "block";


        if(
          editor.style.display === "block"
        ){

          textarea.focus();

        }

      };


    /* DELETE */

    const del =
      document.createElement("button");


    del.className =
      "delete";


    del.textContent =
      "delete";


    del.onclick =
      async () => {

        if(
          !auth.currentUser ||
          !confirm(
            "Delete this repost?"
          )
        ){

          return;

        }


        try{

          await repostsRef
            .doc(item.id)
            .delete();


          status(
            "editorStatus",
            "repost deleted ♡"
          );


          await loadReposts();


        }catch(e){

          console.error(e);


          status(
            "editorStatus",
            "couldn't delete repost ♡"
          );

        }

      };


    actions.appendChild(edit);

    actions.appendChild(del);


    card.appendChild(actions);


    grid.appendChild(card);

  });


  /* INSTAGRAM */

  if(window.instgrm){

    window.instgrm.Embeds.process();

  }

}


/* =========================================
   GET VISITOR IP
========================================= */

async function getVisitorIP(){

  try{

    const response =
      await fetch(
        "https://api.ipify.org?format=json",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      return null;

    }


    const data =
      await response.json();


    return data.ip || null;


  }catch(e){

    console.error(
      "IP lookup failed:",
      e
    );


    return null;

  }

}


/* =========================================
   GET SIMPLE BROWSER NAME
========================================= */

function getBrowserName(){

  const ua =
    navigator.userAgent;


  if(/Edg\//i.test(ua)){
    return "Edge";
  }

  if(/OPR\//i.test(ua)){
    return "Opera";
  }

  if(/Chrome\//i.test(ua) &&
     !/Edg\//i.test(ua)){
    return "Chrome";
  }

  if(/Firefox\//i.test(ua)){
    return "Firefox";
  }

  if(/Safari\//i.test(ua) &&
     !/Chrome\//i.test(ua)){
    return "Safari";
  }

  return "Other";

}


/* =========================================
   GET DEVICE TYPE
========================================= */

function getDeviceType(){

  const width =
    window.innerWidth;


  if(width <= 520){
    return "phone";
  }

  if(width <= 1000){
    return "tablet";
  }

  return "desktop";

}


/* =========================================
   RECORD VIEWER
========================================= */

async function recordViewer(){

  try{

    const ip =
      await getVisitorIP();


    /*
      If the IP lookup failed,
      don't create an unidentified record.
    */

    if(!ip){

      return;

    }


    /*
      THIS IS THE IMPORTANT PART.

      Your own IP is ignored completely.
    */

    if(ip === EXCLUDED_IP){

      return;

    }


    await viewerHistoryRef.add({

      ip:ip,

      visitedAt:
        firebase
          .firestore
          .FieldValue
          .serverTimestamp(),

      page:
        window.location.pathname,

      url:
        window.location.href,

      referrer:
        document.referrer || "",

      browser:
        getBrowserName(),

      device:
        getDeviceType(),

      screen:
        window.innerWidth +
        "x" +
        window.innerHeight,

      userAgent:
        navigator.userAgent

    });


  }catch(e){

    /*
      Viewer history should NEVER
      break the repost page.
    */

    console.error(
      "Viewer history error:",
      e
    );

  }

}


/* =========================================
   LOAD VIEWER HISTORY
========================================= */

async function loadViewerHistory(){

  const body =
    document.getElementById(
      "historyBody"
    );


  body.innerHTML =
    '<tr><td colspan="5" class="history-empty">loading history ♡</td></tr>';


  try{

    const snap =
      await viewerHistoryRef
        .orderBy(
          "visitedAt",
          "desc"
        )
        .limit(200)
        .get();


    body.innerHTML = "";


    if(snap.empty){

      body.innerHTML =
        '<tr><td colspan="5" class="history-empty">no viewers yet ♡</td></tr>';

      return;

    }


    snap.forEach(doc => {

      const data =
        doc.data();


      const row =
        document.createElement("tr");


      /* TIME */

      const timeCell =
        document.createElement("td");


      if(data.visitedAt){

        const date =
          data.visitedAt
            .toDate();


        timeCell.textContent =
          date.toLocaleString();

      }else{

        timeCell.textContent =
          "just now";

      }


      /* IP */

      const ipCell =
        document.createElement("td");


      ipCell.className =
        "history-ip";


      ipCell.textContent =
        data.ip || "unknown";


      /* PAGE */

      const pageCell =
        document.createElement("td");


      pageCell.textContent =
        data.page || "/";


      /* DEVICE */

      const deviceCell =
        document.createElement("td");


      deviceCell.textContent =
        data.device || "unknown";


      /* BROWSER */

      const browserCell =
        document.createElement("td");


      const browserName =
        data.browser || "unknown";


      const screen =
        data.screen || "";


      browserCell.innerHTML =
        "<strong>" +
        browserName +
        "</strong>" +
        (
          screen
            ? '<div class="history-small">' +
              screen +
              "</div>"
            : ""
        );


      row.appendChild(timeCell);

      row.appendChild(ipCell);

      row.appendChild(pageCell);

      row.appendChild(deviceCell);

      row.appendChild(browserCell);


      body.appendChild(row);

    });


    status(
      "historyStatus",
      "showing the 200 most recent visits ♡"
    );


  }catch(e){

    console.error(e);


    body.innerHTML =
      '<tr><td colspan="5" class="history-empty">couldn\'t load viewer history ♡</td></tr>';


    status(
      "historyStatus",
      "check your Firestore rules ♡"
    );

  }

}


/* =========================================
   CLEAR VIEWER HISTORY
========================================= */

async function clearViewerHistory(){

  if(!auth.currentUser){

    return;

  }


  if(
    !confirm(
      "Clear all viewer history?"
    )
  ){

    return;

  }


  try{

    const snap =
      await viewerHistoryRef
        .limit(500)
        .get();


    if(snap.empty){

      status(
        "historyStatus",
        "history is already empty ♡"
      );

      return;

    }


    const batch =
      db.batch();


    snap.forEach(doc => {

      batch.delete(doc.ref);

    });


    await batch.commit();


    status(
      "historyStatus",
      "viewer history cleared ♡"
    );


    await loadViewerHistory();


  }catch(e){

    console.error(e);


    status(
      "historyStatus",
      "couldn't clear history ♡"
    );

  }

}

/* =========================================
   ADD REPOST
========================================= */

document
  .getElementById("addBtn")
  .onclick =
  async () => {

    if(!auth.currentUser){

      return status(
        "editorStatus",
        "please log in first ♡"
      );

    }


    const url =
      normalizeUrl(
        document
          .getElementById("url")
          .value
      );


    const caption =
      document
        .getElementById("caption")
        .value
        .trim();


    if(!url){

      return status(
        "editorStatus",
        "please enter a valid Instagram link ♡"
      );

    }


    try{

      await repostsRef.add({

        url:url,

        caption:caption,

        createdAt:
          firebase
            .firestore
            .FieldValue
            .serverTimestamp()

      });


      document
        .getElementById("url")
        .value = "";


      document
        .getElementById("caption")
        .value = "";


      status(
        "editorStatus",
        "repost saved for everyone ♡"
      );


      await loadReposts();


    }catch(e){

      console.error(e);


      status(
        "editorStatus",
        "couldn't save repost ♡"
      );

    }

  };
