<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>my gallery ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   COLORS
   ========================================================= */

:root {

  --pink: #f5dce5;
  --pink-soft: #fff7fa;
  --pink-border: #efd5df;

  --text: #654f59;
  --muted: #a08b94;

  --white: #ffffff;

  --shadow:
    0 7px 22px rgba(100, 70, 85, 0.08);

}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}


html {
  scroll-behavior: smooth;
}


body {

  margin: 0;

  background:
    radial-gradient(
      circle at 10% 0%,
      #fcebf1,
      transparent 28%
    ),
    linear-gradient(
      #fffafd,
      #ffffff
    );

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow-x: hidden;

}


/* =========================================================
   PAGE
   ========================================================= */

.page {

  width: 100%;

  max-width: 1500px;

  margin: 0 auto;

  padding:
    28px
    clamp(10px, 3vw, 32px)
    60px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  text-align: center;

  padding:
    8px
    10px
    20px;

}


.header h1 {

  margin: 0;

  font-family: Georgia, serif;

  font-weight: 500;

  font-size:
    clamp(30px, 4vw, 46px);

}


.header p {

  margin:
    7px
    0
    0;

  color: var(--muted);

  font-size: 13px;

  letter-spacing: .04em;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.actions {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 8px;

  margin-bottom: 18px;

}


.button {

  border:
    1px solid
    var(--pink-border);

  border-radius: 999px;

  padding:
    9px
    16px;

  background: var(--pink);

  color: #765766;

  cursor: pointer;

  font-size: 13px;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


.button:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 5px 15px
    rgba(100,70,85,.08);

}


.button:disabled {

  opacity: .6;

  cursor: not-allowed;

}


.admin-only {
  display: none;
}


/* =========================================================
   SECTION NAVIGATION
   ========================================================= */

.section-nav {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 7px;

  margin-bottom: 18px;

}


.section-nav button {

  border:
    1px solid
    var(--pink-border);

  border-radius: 999px;

  padding:
    7px
    13px;

  background: white;

  color: var(--muted);

  cursor: pointer;

  font-size: 12px;

}


.section-nav button:hover {

  background:
    var(--pink-soft);

}


.section-nav button.active {

  background:
    var(--pink-soft);

  color:
    var(--text);

  border-color:
    #dcaabb;

}


/* =========================================================
   SORT
   ========================================================= */

.sort-row {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 7px;

  margin-bottom: 25px;

  color: var(--muted);

  font-size: 12px;

}


.sort-row select {

  width: auto;

  min-width: 150px;

  padding:
    7px
    12px;

}


/* =========================================================
   SECTION HEADING
   ========================================================= */

.section-heading {

  text-align: center;

  margin-bottom: 18px;

}


.section-heading h2 {

  margin: 0;

  font-family: Georgia, serif;

  font-size: 23px;

  font-weight: 500;

}


.section-heading p {

  margin:
    5px
    0
    0;

  color: var(--muted);

  font-size: 12px;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

}


/* =========================================================
   GALLERY
   ========================================================= */

.gallery {

  display: grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0, 1fr)
    );

  align-items: start;

  gap:
    clamp(
      10px,
      1.4vw,
      18px
    );

  width: 100%;

}


/* =========================================================
   CARD
   ========================================================= */

.card {

  width: 100%;

  min-width: 0;

  background:
    var(--white);

  border:
    1px solid
    rgba(
      239,
      213,
      223,
      .6
    );

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    var(--shadow);

  align-self: start;

}


/* =========================================================
   MEDIA
   ========================================================= */

.media {

  width: 100%;

  overflow: hidden;

  background:
    #fff;

}


/*
  PHOTOS

  No fixed height.
  No cropping.
  Natural aspect ratio.

  The image can remain at its natural
  dimensions when it fits the card.

  max-width prevents horizontal scrolling.
*/

.media img {

  display: block;

  width: auto;

  height: auto;

  max-width: 100%;

  margin:
    0 auto;

  cursor: zoom-in;

}


/*
  VIDEOS

  Videos remain responsive and
  have native controls.
*/

.media video {

  display: block;

  width: 100%;

  height: auto;

  max-width: 100%;

  background: #000;

}


/* =========================================================
   INFO
   ========================================================= */

.memory-info {

  padding:
    11px
    13px
    13px;

}


/* DATE */

.date {

  color: var(--muted);

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: .07em;

  margin-bottom: 5px;

}


/* LOCATION */

.location {

  color: #9b7784;

  font-size: 11px;

  margin-bottom: 6px;

}


/* CAPTION */

.caption {

  font-family: Georgia, serif;

  font-size: 14px;

  line-height: 1.5;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

}


/* =========================================================
   DELETE
   ========================================================= */

.card-actions {

  display: none;

  justify-content: flex-end;

  padding:
    0
    10px
    10px;

}


body.admin-mode
.card-actions {

  display: flex;

}


.delete-button {

  border: 0;

  background:
    transparent;

  color:
    var(--muted);

  cursor: pointer;

  font-size: 11px;

}


.delete-button:hover {

  color:
    #9b596e;

}


/* =========================================================
   EMPTY
   ========================================================= */

.empty {

  grid-column:
    1 / -1;

  padding:
    50px
    20px;

  text-align: center;

  color:
    var(--muted);

  font-family:
    Georgia,
    serif;

}


/* =========================================================
   MODALS
   ========================================================= */

.modal,
.lightbox {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(
      45,
      30,
      37,
      .58
    );

  backdrop-filter:
    blur(5px);

}


.modal.open,
.lightbox.open {

  display: flex;

}


.modal-box {

  position: relative;

  width:
    min(
      480px,
      100%
    );

  max-height:
    90vh;

  overflow-y:
    auto;

  padding:
    24px;

  background:
    white;

  border-radius:
    22px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.2);

}


.modal-box h2 {

  margin:
    0
    0
    5px;

  font-family:
    Georgia,
    serif;

  font-weight:
    500;

}


.modal-subtitle {

  margin:
    0
    0
    20px;

  color:
    var(--muted);

  font-size:
    12px;

}


.close {

  position:
    absolute;

  top:
    12px;

  right:
    15px;

  width:
    34px;

  height:
    34px;

  border:
    0;

  border-radius:
    50%;

  background:
    var(--pink-soft);

  color:
    var(--text);

  font-size:
    20px;

  cursor:
    pointer;

}


/* =========================================================
   FORM
   ========================================================= */

.form-group {

  margin-bottom:
    15px;

}


.form-group label {

  display:
    block;

  margin-bottom:
    6px;

  font-size:
    12px;

  font-weight:
    600;

}


input,
select,
textarea {

  width:
    100%;

  border:
    1px solid
    var(--pink-border);

  border-radius:
    12px;

  padding:
    10px
    12px;

  background:
    #fffafb;

  color:
    var(--text);

  font:
    inherit;

  font-size:
    13px;

}


textarea {

  min-height:
    90px;

  resize:
    vertical;

}


.submit {

  width:
    100%;

  border:
    0;

  border-radius:
    999px;

  padding:
    11px;

  background:
    var(--pink);

  color:
    #765766;

  cursor:
    pointer;

}


.submit:disabled {

  opacity:
    .6;

  cursor:
    not-allowed;

}


.status {

  display:
    none;

  padding:
    9px;

  margin-bottom:
    14px;

  border-radius:
    10px;

  background:
    var(--pink-soft);

  color:
    var(--muted);

  font-size:
    12px;

}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox img {

  display:
    block;

  max-width:
    94vw;

  max-height:
    90vh;

  width:
    auto;

  height:
    auto;

  border-radius:
    18px;

  box-shadow:
    0 20px 80px
    rgba(0,0,0,.3);

}


.lightbox .close {

  position:
    fixed;

  top:
    15px;

  right:
    18px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

  .gallery {

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

  }

}


@media (max-width: 520px) {

  .page {

    padding-left:
      9px;

    padding-right:
      9px;

  }


  .gallery {

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

    gap:
      9px;

  }


  .card {

    border-radius:
      14px;

  }


  .memory-info {

    padding:
      9px
      10px
      11px;

  }


  .caption {

    font-size:
      13px;

  }

}

</style>

</head>


<body>


<main class="page">


<!-- =======================================================
     HEADER

     CHANGE YOUR TITLE/SUBTITLE HERE
     ======================================================= -->

<header class="header">

  <h1>
    my gallery ♡
  </h1>

  <p>
    photos, videos &amp; little memories
  </p>

</header>


<!-- =======================================================
     BUTTONS
     ======================================================= -->

<div class="actions">

  <button
    class="button"
    id="adminButton">

    🔒 admin

  </button>


  <button
    class="button admin-only"
    id="logoutButton">

    log out

  </button>


  <button
    class="button admin-only"
    id="addMemoryButton">

    ＋ add a little memory

  </button>


  <button
    class="button admin-only"
    id="newSectionButton">

    ＋ new section

  </button>

</div>


<!-- =======================================================
     SECTIONS
     ======================================================= -->

<nav
  class="section-nav"
  id="sectionNav">
</nav>


<!-- =======================================================
     SECTION HEADING
     ======================================================= -->

<div
  class="section-heading"
  id="sectionHeading">
</div>


<!-- =======================================================
     SORTING
     ======================================================= -->

<div class="sort-row">

  <span>
    sort by
  </span>

  <select id="sortSelect">

    <option value="newest">
      newest first
    </option>

    <option value="oldest">
      oldest first
    </option>

    <option value="added">
      recently added
    </option>

  </select>

</div>


<!-- =======================================================
     GALLERY
     ======================================================= -->

<section
  class="gallery"
  id="gallery">

  <div class="empty">
    loading memories ♡
  </div>

</section>


</main>



<!-- =======================================================
     LOGIN MODAL
     ======================================================= -->

<div
  class="modal"
  id="loginModal">

  <div class="modal-box">

    <button
      class="close"
      data-close="loginModal">

      ×

    </button>


    <h2>
      admin ♡
    </h2>


    <p class="modal-subtitle">
      log in to manage your memories
    </p>


    <div
      class="status"
      id="loginStatus">
    </div>


    <div class="form-group">

      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com">

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="your password">

    </div>


    <button
      class="submit"
      id="loginSubmit">

      log in ♡

    </button>

  </div>

</div>



<!-- =======================================================
     ADD MEMORY MODAL
     ======================================================= -->

<div
  class="modal"
  id="memoryModal">

  <div class="modal-box">

    <button
      class="close"
      data-close="memoryModal">

      ×

    </button>


    <h2>
      add a little memory ♡
    </h2>


    <p class="modal-subtitle">
      add a photo or video
    </p>


    <div class="form-group">

      <label>
        Photo or video
      </label>

      <input
        id="file"
        type="file"
        accept="image/*,video/*">

    </div>


    <div class="form-group">

      <label>
        Section
      </label>

      <select id="memorySection">
      </select>

    </div>


    <div class="form-group">

      <label>
        Date — optional
      </label>

      <input
        id="memoryDate"
        type="date">

    </div>


    <div class="form-group">

      <label>
        Location — optional
      </label>

      <input
        id="memoryLocation"
        type="text"
        placeholder="Toronto, Canada">

    </div>


    <div class="form-group">

      <label>
        Caption — optional
      </label>

      <textarea
        id="memoryCaption"
        placeholder="a little memory ♡">
      </textarea>

    </div>


    <button
      class="submit"
      id="saveMemory">

      add memory ♡

    </button>

  </div>

</div>



<!-- =======================================================
     NEW SECTION MODAL
     ======================================================= -->

<div
  class="modal"
  id="sectionModal">

  <div class="modal-box">

    <button
      class="close"
      data-close="sectionModal">

      ×

    </button>


    <h2>
      new section ♡
    </h2>


    <p class="modal-subtitle">
      create a new album for your memories
    </p>


    <div class="form-group">

      <label>
        Section name
      </label>

      <input
        id="sectionName"
        placeholder="summer ♡">

    </div>


    <div class="form-group">

      <label>
        Subtitle — optional
      </label>

      <textarea
        id="sectionSubtitle"
        placeholder="sunny days & little adventures">
      </textarea>

    </div>


    <button
      class="submit"
      id="saveSection">

      create section ♡

    </button>

  </div>

</div>



<!-- =======================================================
     LIGHTBOX
     ======================================================= -->

<div
  class="lightbox"
  id="lightbox">

  <button
    class="close"
    id="closeLightbox">

    ×

  </button>


  <img
    id="lightboxImage"
    alt="">

</div>



<script>

/* =========================================================
   =========================================================

   SUPABASE SETTINGS

   PUT YOUR REAL PUBLISHABLE / ANON KEY HERE.

   DO NOT USE A SERVICE_ROLE SECRET KEY.

   =========================================================
   ========================================================= */

const SUPABASE_URL =
  "https://jhdjzuneqtmtglindcia.supabase.co";


const SUPABASE_KEY =
  "PASTE-YOUR-PUBLISHABLE-OR-ANON-KEY-HERE";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ADMIN ACCOUNT
   ========================================================= */

const ADMIN_UID =
  "d512046e-1639-4c5a-8143-8b5602bd03f0";


/* =========================================================
   STATE
   ========================================================= */

let currentUser =
  null;

let sections =
  [];

let activeSection =
  "all";

let currentSort =
  "newest";


/* =========================================================
   MODAL HELPERS
   ========================================================= */

function openModal(id) {

  document
    .getElementById(id)
    .classList
    .add("open");

}


function closeModal(id) {

  document
    .getElementById(id)
    .classList
    .remove("open");

}


/* =========================================================
   CLOSE BUTTONS
   ========================================================= */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        closeModal(
          button.dataset.close
        );

      }
    );

  });


/* =========================================================
   ADMIN BUTTON
   ========================================================= */

document
  .getElementById("adminButton")
  .addEventListener(
    "click",
    () => {

      if (currentUser) {
        return;
      }

      openModal(
        "loginModal"
      );

    }
  );


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginSubmit")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const status =
        document
          .getElementById(
            "loginStatus"
          );


      status.style.display =
        "none";


      if (
        !email ||
        !password
      ) {

        status.textContent =
          "Please enter your email and password ♡";

        status.style.display =
          "block";

        return;

      }


      const button =
        document
          .getElementById(
            "loginSubmit"
          );


      button.disabled =
        true;

      button.textContent =
        "logging in...";


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      button.disabled =
        false;

      button.textContent =
        "log in ♡";


      if (error) {

        status.textContent =
          error.message;

        status.style.display =
          "block";

        return;

      }


      if (
        !data.user ||
        data.user.id !==
        ADMIN_UID
      ) {

        await supabaseClient
          .auth
          .signOut();


        status.textContent =
          "This account isn't the gallery admin ♡";

        status.style.display =
          "block";

        return;

      }


      currentUser =
        data.user;


      closeModal(
        "loginModal"
      );


      updateAdminUI();

    }
  );


/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();


      currentUser =
        null;


      updateAdminUI();

    }
  );


/* =========================================================
   ADMIN UI
   ========================================================= */

function updateAdminUI() {

  const adminElements =
    document
      .querySelectorAll(
        ".admin-only"
      );


  adminElements
    .forEach(element => {

      const isAdmin =
        currentUser &&
        currentUser.id ===
        ADMIN_UID;


      element.style.display =
        isAdmin
          ? "inline-block"
          : "none";

    });


  document.body.classList.toggle(
    "admin-mode",
    Boolean(currentUser)
  );

}


/* =========================================================
   LOAD SECTIONS
   ========================================================= */

async function loadSections() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("sections")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Could not load sections:",
      error
    );

    sections =
      [];

    renderSectionNavigation();

    renderSectionSelect();

    return;

  }


  sections =
    data || [];


  renderSectionNavigation();

  renderSectionSelect();

}


/* =========================================================
   SECTION NAVIGATION
   ========================================================= */

function renderSectionNavigation() {

  const nav =
    document
      .getElementById(
        "sectionNav"
      );


  nav.innerHTML =
    "";


  /* BUILT-IN ALL MEMORIES */

  const allButton =
    document.createElement(
      "button"
    );


  allButton.textContent =
    "all memories ♡";


  allButton.classList.toggle(
    "active",
    activeSection ===
    "all"
  );


  allButton.addEventListener(
    "click",
    () => {

      activeSection =
        "all";


      renderSectionNavigation();

      loadGallery();

    }
  );


  nav.appendChild(
    allButton
  );


  /*
    Don't display a duplicate
    database section called
    "all memories ♡".
  */

  sections
    .filter(
      section =>
        section.title
          .trim()
          .toLowerCase() !==
        "all memories ♡"
    )
    .forEach(
      section => {

        const button =
          document.createElement(
            "button"
          );


        button.textContent =
          section.title;


        button.classList.toggle(
          "active",
          activeSection ===
          section.id
        );


        button.addEventListener(
          "click",
          () => {

            activeSection =
              section.id;


            renderSectionNavigation();

            loadGallery();

          }
        );


        nav.appendChild(
          button
        );

      }
    );

}


/* =========================================================
   SECTION SELECT
   ========================================================= */

function renderSectionSelect() {

  const select =
    document
      .getElementById(
        "memorySection"
      );


  select.innerHTML =
    "";


  const allOption =
    document.createElement(
      "option"
    );


  allOption.value =
    "all memories ♡";


  allOption.textContent =
    "all memories ♡";


  select.appendChild(
    allOption
  );


  sections
    .filter(
      section =>
        section.title
          .trim()
          .toLowerCase() !==
        "all memories ♡"
    )
    .forEach(
      section => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          section.title;


        option.textContent =
          section.title;


        select.appendChild(
          option
        );

      }
    );

}


/* =========================================================
   SECTION HEADING
   ========================================================= */

function updateHeading() {

  const heading =
    document
      .getElementById(
        "sectionHeading"
      );


  heading.innerHTML =
    "";


  if (
    activeSection ===
    "all"
  ) {

    heading.innerHTML = `
      <h2>all memories ♡</h2>
      <p>photos, videos & little memories</p>
    `;

    return;

  }


  const section =
    sections.find(
      item =>
        item.id ===
        activeSection
    );


  if (!section) {
    return;
  }


  const title =
    document.createElement(
      "h2"
    );


  title.textContent =
    section.title;


  heading.appendChild(
    title
  );


  if (
    section.subtitle
  ) {

    const subtitle =
      document.createElement(
        "p"
      );


    subtitle.textContent =
      section.subtitle;


    heading.appendChild(
      subtitle
    );

  }

}

/* =========================================================
   STORAGE URL
   ========================================================= */

function getMediaURL(
  path
) {

  if (!path) {
    return "";
  }


  const result =
    supabaseClient
      .storage
      .from("gallery")
      .getPublicUrl(path);


  return result
    .data
    .publicUrl;

}


/* =========================================================
   SORT MEMORIES
   ========================================================= */

function sortMemories(
  memories
) {

  return [
    ...memories
  ].sort(
    (a, b) => {

      if (
        currentSort ===
        "added"
      ) {

        return new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        );

      }


      /*
        Memories with an actual
        memory_date are sorted first.

        Memories without a date
        fall to the bottom.
      */

      const dateA =
        a.memory_date
          ? new Date(
              a.memory_date
            ).getTime()
          : null;


      const dateB =
        b.memory_date
          ? new Date(
              b.memory_date
            ).getTime()
          : null;


      if (
        dateA === null &&
        dateB === null
      ) {

        return new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        );

      }


      if (
        dateA === null
      ) {

        return 1;

      }


      if (
        dateB === null
      ) {

        return -1;

      }


      if (
        currentSort ===
        "oldest"
      ) {

        return dateA -
          dateB;

      }


      return dateB -
        dateA;

    }
  );

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(
  value
) {

  if (!value) {
    return "";
  }


  const date =
    new Date(
      value +
      "T00:00:00"
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleDateString(
    undefined,
    {
      year:
        "numeric",

      month:
        "long",

      day:
        "numeric"
    }
  );

}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function loadGallery() {

  updateHeading();


  const gallery =
    document
      .getElementById(
        "gallery"
      );


  gallery.innerHTML = `
    <div class="empty">
      loading memories ♡
    </div>
  `;


  let query =
    supabaseClient
      .from("memories")
      .select("*");


  /*
    We don't use database ordering
    here because the website handles
    the three sorting choices.
  */

  if (
    activeSection !==
    "all"
  ) {

    const section =
      sections.find(
        item =>
          item.id ===
          activeSection
      );


    if (section) {

      query =
        query.eq(
          "album",
          section.title
        );

    }

  }


  const {
    data,
    error
  } =
    await query;


  if (error) {

    console.error(
      "Could not load memories:",
      error
    );


    gallery.innerHTML = `
      <div class="empty">
        couldn't load memories ♡
      </div>
    `;


    return;

  }


  gallery.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    gallery.innerHTML = `
      <div class="empty">
        no memories here yet ♡
      </div>
    `;


    return;

  }


  const memories =
    sortMemories(
      data
    );


  memories.forEach(
    item => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const url =
        getMediaURL(
          item.file_path
        );


      /* =================================================
         IMAGE
         ================================================= */

      if (
        item.type ===
        "image"
      ) {

        const image =
          document.createElement(
            "img"
          );


        image.loading =
          "lazy";


        image.decoding =
          "async";


        image.alt =
          item.caption &&
          item.caption.trim()
            ? item.caption
            : "Gallery photo";


        image.src =
          url;


        image.addEventListener(
          "error",
          () => {

            media.innerHTML = `
              <div
                style="
                  padding:30px;
                  text-align:center;
                  color:#a08b94;
                  font-size:12px;
                "
              >
                photo unavailable ♡
              </div>
            `;

          }
        );


        /*
          Photos open in the
          lightbox when clicked.
        */

        image.addEventListener(
          "click",
          () => {

            const lightboxImage =
              document
                .getElementById(
                  "lightboxImage"
                );


            lightboxImage.src =
              url;


            lightboxImage.alt =
              image.alt;


            openModal(
              "lightbox"
            );

          }
        );


        media.appendChild(
          image
        );

      }


      /* =================================================
         VIDEO
         ================================================= */

      else if (
        item.type ===
        "video"
      ) {

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;


        video.preload =
          "metadata";


        video.playsInline =
          true;


        video.src =
          url;


        video.addEventListener(
          "error",
          () => {

            media.innerHTML = `
              <div
                style="
                  padding:30px;
                  text-align:center;
                  color:#a08b94;
                  font-size:12px;
                "
              >
                video unavailable ♡
              </div>
            `;

          }
        );


        media.appendChild(
          video
        );

      }


      card.appendChild(
        media
      );


      /* =================================================
         INFORMATION
         ================================================= */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "memory-info";


      /*
        DATE
      */

      if (
        item.memory_date
      ) {

        const date =
          document.createElement(
            "div"
          );


        date.className =
          "date";


        date.textContent =
          formatDate(
            item.memory_date
          );


        info.appendChild(
          date
        );

      }


      /*
        LOCATION

        Only displayed if
        the user entered one.
      */

      if (
        item.location &&
        item.location.trim()
      ) {

        const location =
          document.createElement(
            "div"
          );


        location.className =
          "location";


        location.textContent =
          "📍 " +
          item.location;


        info.appendChild(
          location
        );

      }


      /*
        CAPTION

        Only displayed if
        the user entered one.
      */

      if (
        item.caption &&
        item.caption.trim()
      ) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "caption";


        caption.textContent =
          item.caption;


        info.appendChild(
          caption
        );

      }


      /*
        Only add the info container
        if it actually contains
        something.
      */

      if (
        info.children.length >
        0
      ) {

        card.appendChild(
          info
        );

      }


      /* =================================================
         ADMIN DELETE
         ================================================= */

      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "card-actions";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "delete";


      deleteButton.addEventListener(
        "click",
        () =>
          deleteMemory(
            item
          )
      );


      actions.appendChild(
        deleteButton
      );


      card.appendChild(
        actions
      );


      gallery.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   DELETE MEMORY
   ========================================================= */

async function deleteMemory(
  item
) {

  if (
    !currentUser ||
    currentUser.id !==
    ADMIN_UID
  ) {

    return;

  }


  const confirmed =
    confirm(
      "Delete this memory? ♡"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("memories")
      .delete()
      .eq(
        "id",
        item.id
      );


  if (error) {

    alert(
      "Couldn't delete the memory ♡\n\n" +
      error.message
    );


    console.error(
      error
    );


    return;

  }


  if (
    item.file_path
  ) {

    await supabaseClient
      .storage
      .from("gallery")
      .remove([
        item.file_path
      ]);

  }


  await loadGallery();

}

/* =========================================================
   SAVE MEMORY
   ========================================================= */

document
  .getElementById(
    "saveMemory"
  )
  .addEventListener(
    "click",
    async () => {

      if (
        !currentUser ||
        currentUser.id !==
        ADMIN_UID
      ) {

        return;

      }


      const file =
        document
          .getElementById(
            "file"
          )
          .files[0];


      if (!file) {

        alert(
          "Please choose a photo or video ♡"
        );


        return;

      }


      const saveButton =
        document
          .getElementById(
            "saveMemory"
          );


      saveButton.disabled =
        true;


      saveButton.textContent =
        "saving... ♡";


      /* =================================================
         TYPE
         ================================================= */

      const type =
        file.type.startsWith(
          "video/"
        )
          ? "video"
          : "image";


      /* =================================================
         SAFE FILE NAME
         ================================================= */

      const cleanName =
        file.name
          .normalize(
            "NFKD"
          )
          .replace(
            /[^\w.\- ]/g,
            ""
          )
          .replace(
            /\s+/g,
            "-"
          );


      const path =
        `${crypto.randomUUID()}-${cleanName}`;


      /* =================================================
         UPLOAD
         ================================================= */

      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("gallery")
          .upload(
            path,
            file,
            {
              contentType:
                file.type,

              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (uploadError) {

        alert(
          "Upload failed ♡\n\n" +
          uploadError.message
        );


        saveButton.disabled =
          false;


        saveButton.textContent =
          "add memory ♡";


        return;

      }


      /* =================================================
         DATE

         Keep the real date in memory_date.
         ================================================= */

      const dateInput =
        document
          .getElementById(
            "memoryDate"
          )
          .value;


      /* =================================================
         LOCATION
         ================================================= */

      const location =
        document
          .getElementById(
            "memoryLocation"
          )
          .value
          .trim();


      /* =================================================
         SECTION
         ================================================= */

      const album =
        document
          .getElementById(
            "memorySection"
          )
          .value;


      /* =================================================
         CAPTION
         ================================================= */

      const caption =
        document
          .getElementById(
            "memoryCaption"
          )
          .value
          .trim();


      /* =================================================
         DATABASE RECORD

         IMPORTANT:
         memory_date is the DATE column.
         location is the LOCATION column.
         ================================================= */

      const {
        error:
          dbError
      } =
        await supabaseClient
          .from("memories")
          .insert({

            type,

            file_path:
              path,

            album,

            memory_date:
              dateInput ||
              null,

            /*
              Keep the old date column
              updated too, so older parts
              of the gallery don't lose it.
            */

            date:
              dateInput
              ? formatDate(
                  dateInput
                )
              : "",

            location,

            caption

          });


      if (dbError) {

        /*
          If the database insert fails,
          remove the uploaded file so
          we don't leave an orphaned file.
        */

        await supabaseClient
          .storage
          .from("gallery")
          .remove([
            path
          ]);


        alert(
          "Couldn't save the memory ♡\n\n" +
          dbError.message
        );


        saveButton.disabled =
          false;


        saveButton.textContent =
          "add memory ♡";


        return;

      }


      /* =================================================
         RESET FORM
         ================================================= */

      document
        .getElementById(
          "file"
        )
        .value =
        "";


      document
        .getElementById(
          "memoryDate"
        )
        .value =
        "";


      document
        .getElementById(
          "memoryLocation"
        )
        .value =
        "";


      document
        .getElementById(
          "memoryCaption"
        )
        .value =
        "";


      closeModal(
        "memoryModal"
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "add memory ♡";


      await loadGallery();

    }
  );

        .forEach(

            modal.classList
              .remove("open");

/* =========================================================
   START
   ========================================================= */

async function start() {

  /*
    Check existing login.
  */

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  currentUser =
    data.session?.user ||
    null;


  /*
    Only your account gets
    admin functionality.
  */

  if (
    currentUser &&
    currentUser.id !==
    ADMIN_UID
  ) {

    await supabaseClient
      .auth
      .signOut();


    currentUser =
      null;

  }


  updateAdminUI();


  await loadSections();

  await loadGallery();

}


/* =========================================================
   START GALLERY
   ========================================================= */

start();
