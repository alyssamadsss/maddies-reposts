<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reposts ♡</title>
<style>
:root{
  --pink:#f6dbe5;
  --pink-deep:#d99aaa;
  --pink-soft:#fff5f8;
  --white:#ffffff;
  --cream:#fffafb;
  --text:#6b505b;
  --muted:#a88e98;
  --line:#efdce3;
  --shadow:0 10px 30px rgba(164,112,132,.10);
  --shadow-hover:0 14px 35px rgba(164,112,132,.15);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 5%,rgba(246,219,229,.55),transparent 25%),
    radial-gradient(circle at 90% 10%,rgba(255,239,245,.8),transparent 25%),
    linear-gradient(180deg,#fff8fa 0%,#fff 55%,#fff9fb 100%);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}
button,input,textarea{font:inherit}
button{transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
button:hover{transform:translateY(-1px)}
.page{max-width:1180px;margin:auto;padding:34px 24px 80px}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}
.brand{
  text-align:left;
}
h1{
  margin:0;
  font-size:38px;
  line-height:1;
  font-weight:500;
  letter-spacing:-.5px;
}
.subtitle{
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.2px;
}
.admin-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.92);
  border-radius:999px;
  padding:9px 15px;
  color:var(--text);
  cursor:pointer;
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.admin-btn:hover{background:var(--pink-soft)}

.divider{
  height:1px;
  background:var(--line);
  margin:0 0 28px;
}

.admin-panel{
  display:none;
  background:rgba(255,255,255,.95);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  margin:0 0 30px;
  box-shadow:var(--shadow);
}
.admin-panel.open{display:block}
.admin-panel h2{
  margin:0 0 16px;
  font-size:21px;
  font-weight:500;
}
.field{margin-bottom:13px}
.field label{
  display:block;
  margin:0 0 6px;
  color:var(--muted);
  font-size:12px;
}
input,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fffafd;
  border-radius:13px;
  padding:11px 13px;
  outline:none;
  color:var(--text);
}
input:focus,textarea:focus{
  border-color:#e3b7c5;
  box-shadow:0 0 0 3px rgba(246,219,229,.35);
}
textarea{min-height:78px;resize:vertical}
.row{display:flex;gap:9px;flex-wrap:wrap}
.primary,.secondary,.delete,.edit,.save,.cancel{
  border-radius:999px;
  padding:9px 15px;
  cursor:pointer;
}
.primary{
  border:1px solid #eac3cf;
  background:var(--pink);
  color:var(--text);
}
.secondary{
  border:1px solid var(--line);
  background:var(--pink-soft);
  color:var(--text);
}
.delete{
  border:1px solid #f0d5dc;
  background:#fff3f5;
  color:#a05d6d;
}
.status{
  font-size:12px;
  color:var(--muted);
  margin-top:10px;
  min-height:16px;
}
.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin:13px 0 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
  align-items:start;
}
.card{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
}
.embed{
  border-radius:13px;
  overflow:hidden;
  background:#fff7fa;
  min-height:180px;
}
.caption{
  padding:11px 5px 3px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.caption.empty-caption{display:none}
.caption-editor{
  margin-top:10px;
  display:none;
}
.admin-on .caption-editor{display:block}
.caption-editor textarea{
  min-height:62px;
  font-size:13px;
}
.card-actions{
  display:none;
  gap:7px;
  justify-content:flex-end;
  margin-top:10px;
}
.admin-on .card-actions{display:flex}
.edit{
  border:1px solid var(--line);
  background:#fffafd;
  color:var(--text);
}
.save{
  border:1px solid #eac3cf;
  background:var(--pink);
  color:var(--text);
}
.cancel{
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:85px 20px;
  font-size:14px;
}
.footer-heart{
  text-align:center;
  color:#caa8b3;
  font-size:13px;
  margin-top:38px;
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  .page{padding:28px 15px 60px}
  h1{font-size:32px}
}
@media(max-width:520px){
  .top{align-items:flex-start}
  .grid{grid-template-columns:1fr}
  .card{border-radius:17px}
  .admin-btn{padding:8px 12px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script async src="https://www.instagram.com/embed.js"></script>
</head>
<body>
<button class="admin-btn" id="adminBtn">♡ admin</button>
<main class="page">
<header><h1>reposts ♡</h1><p class="subtitle">little things worth reposting</p></header>
<section class="admin-panel" id="adminPanel">
<h2>manage reposts ♡</h2>
<div id="loginArea">
<div class="field"><label>admin email</label><input id="email" type="email" autocomplete="username" placeholder="your email"></div>
<div class="field"><label>admin password</label><input id="password" type="password" autocomplete="current-password" placeholder="your Firebase password"></div>
<button class="primary" id="loginBtn">unlock ♡</button><div class="status" id="loginStatus"></div>
</div>
<div id="editorArea" style="display:none">
<div class="field"><label>Instagram post / reel link</label><input id="url" type="url" placeholder="https://www.instagram.com/p/.../"></div>
<div class="field"><label>caption</label><textarea id="caption" placeholder="write a little caption ♡"></textarea></div>
<div class="row"><button class="primary" id="addBtn">add repost ♡</button><button class="secondary" id="logoutBtn">lock</button></div>
<div class="status" id="editorStatus"></div><p class="note">add, edit or remove reposts here ♡ everyone sees the same updates.</p>
</div>
</section>
<section class="grid" id="grid"></section><div class="empty" id="empty">loading reposts ♡</div>
</main>
<script>
const firebaseConfig={
apiKey:"AIzaSyDdnRqRysHijmVJo9lqGHz5Oc7YaigNDow",
authDomain:"mads-reposts.firebaseapp.com",
projectId:"mads-reposts",
storageBucket:"mads-reposts.firebasestorage.app",
messagingSenderId:"366856299182",
appId:"1:366856299182:web:0abe419dac4929a134c33f",
measurementId:"G-LDN3FL4JCM"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),repostsRef=db.collection("reposts");
let items=[];
function status(id,text){document.getElementById(id).textContent=text}
function normalizeUrl(raw){try{const u=new URL(raw.trim());if(!/instagram\.com$/i.test(u.hostname)&&!/\.instagram\.com$/i.test(u.hostname))return null;return u.href}catch{return null}}
function setAdmin(on){document.body.classList.toggle("admin-on",on);document.getElementById("loginArea").style.display=on?"none":"block";document.getElementById("editorArea").style.display=on?"block":"none"}
async function loadReposts(){try{const snap=await repostsRef.orderBy("createdAt","desc").get();items=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);document.getElementById("empty").textContent="couldn't load reposts ♡"}}
function render(){
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  grid.innerHTML="";
  empty.style.display=items.length?"none":"block";

  items.forEach(item=>{
    const card=document.createElement("article");
    card.className="card";

    const embed=document.createElement("div");
    embed.className="embed";

    const block=document.createElement("blockquote");
    block.className="instagram-media";
    block.setAttribute("data-instgrm-permalink",item.url);
    block.setAttribute("data-instgrm-version","14");
    block.style.cssText="background:#FFF;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);margin:0;max-width:540px;min-width:326px;padding:0;width:100%;";

    embed.appendChild(block);
    card.appendChild(embed);

    const caption=document.createElement("div");
    caption.className="caption" + (item.caption ? "" : " empty-caption");
    caption.textContent=item.caption || "";
    card.appendChild(caption);

    const editor=document.createElement("div");
    editor.className="caption-editor";

    const textarea=document.createElement("textarea");
    textarea.value=item.caption || "";
    textarea.placeholder="edit caption ♡";

    const editRow=document.createElement("div");
    editRow.className="row";
    editRow.style.marginTop="7px";

    const save=document.createElement("button");
    save.className="save";
    save.textContent="save caption ♡";

    const cancel=document.createElement("button");
    cancel.className="cancel";
    cancel.textContent="cancel";

    save.onclick=async()=>{
      if(!auth.currentUser)return;
      save.disabled=true;
      try{
        await repostsRef.doc(item.id).update({
          caption:textarea.value.trim()
        });
        status("editorStatus","caption updated ♡");
        await loadReposts();
      }catch(e){
        console.error(e);
        status("editorStatus","couldn't update caption ♡");
        save.disabled=false;
      }
    };

    cancel.onclick=()=>{
      textarea.value=item.caption || "";
      editor.style.display="none";
    };

    editRow.appendChild(save);
    editRow.appendChild(cancel);
    editor.appendChild(textarea);
    editor.appendChild(editRow);
    card.appendChild(editor);

    const actions=document.createElement("div");
    actions.className="card-actions";

    const edit=document.createElement("button");
    edit.className="edit";
    edit.textContent="edit caption";

    edit.onclick=()=>{
      editor.style.display=editor.style.display==="block"?"none":"block";
      if(editor.style.display==="block")textarea.focus();
    };

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="delete";

    del.onclick=async()=>{
      if(!auth.currentUser||!confirm("Delete this repost?"))return;
      try{
        await repostsRef.doc(item.id).delete();
        status("editorStatus","repost deleted ♡");
        await loadReposts();
      }catch(e){
        console.error(e);
        status("editorStatus","couldn't delete repost ♡");
      }
    };

    actions.appendChild(edit);
    actions.appendChild(del);
    card.appendChild(actions);
    grid.appendChild(card);
  });

  if(window.instgrm)window.instgrm.Embeds.process();
}
document.getElementById("adminBtn").onclick=()=>document.getElementById("adminPanel").classList.toggle("open");
document.getElementById("loginBtn").onclick=async()=>{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password)return status("loginStatus","enter your email and password ♡");try{await auth.signInWithEmailAndPassword(email,password);setAdmin(true);status("loginStatus","")}catch(e){console.error(e);status("loginStatus","incorrect email or password ♡")}};
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
document.getElementById("logoutBtn").onclick=async()=>{await auth.signOut();setAdmin(false)};
document.getElementById("addBtn").onclick=async()=>{if(!auth.currentUser)return status("editorStatus","please log in first ♡");const url=normalizeUrl(document.getElementById("url").value),caption=document.getElementById("caption").value.trim();if(!url)return status("editorStatus","please enter a valid Instagram link ♡");try{await repostsRef.add({url,caption,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById("url").value="";document.getElementById("caption").value="";status("editorStatus","repost saved for everyone ♡");await loadReposts()}catch(e){console.error(e);status("editorStatus","couldn't save repost ♡")}};
auth.onAuthStateChanged(user=>setAdmin(!!user));loadReposts();
</script>
</body>
</html>
