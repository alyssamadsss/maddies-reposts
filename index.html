<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things that spoke to me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #faf8f7;
      color: #2f2a2a;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      padding: 34px 20px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 7px 0 14px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: lowercase;
      color: #8a7777;
    }

    .add-button {
      border: 1px solid #d9cdca;
      background: white;
      color: #5e4f4f;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: .2s;
    }

    .add-button:hover {
      background: #f5efed;
    }

    .feed {
      height: 760px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 18px 20px;
      border: 1px solid #e7dfdd;
      border-radius: 22px;
      background: #fffdfc;
      box-shadow: 0 8px 28px rgba(55, 40, 40, .06);
      scrollbar-width: thin;
      scrollbar-color: #cbbdbc transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .post {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #eee7e5;
      min-width: 0;
    }

    .post iframe {
      display: block;
      width: 100%;
      min-height: 620px;
      border: 0;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9a8989;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 30, .35);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #fffdfc;
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 15px 50px rgba(40, 30, 30, .18);
    }

    .modal-box h2 {
      margin: 0 0 8px;
      font-weight: 500;
    }

    .modal-box p {
      margin: 0 0 16px;
      color: #8a7777;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .url-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd2d0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .url-input:focus {
      border-color: #b9a5a1;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .modal-buttons button {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid #d9cdca;
      background: white;
      cursor: pointer;
    }

    .modal-buttons .add {
      background: #4f4141;
      color: white;
      border-color: #4f4141;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 12px;
      }

      .feed {
        height: 78vh;
        padding: 6px 10px 16px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .post iframe {
        min-height: 620px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <h1>things that spoke to me</h1>
      <div class="subtitle">maddie's reposts</div>

      <button class="add-button" onclick="openModal()">
        + Add Repost
      </button>
    </header>

    <section class="feed">
      <div class="grid" id="grid"></div>
    </section>

  </main>

  <div class="modal" id="modal">
    <div class="modal-box">

      <h2>Add a repost</h2>

      <p>
        Paste the Instagram post or reel link below.
      </p>

      <input
        id="urlInput"
        class="url-input"
        type="text"
        placeholder="https://www.instagram.com/p/..."
      >

      <div class="modal-buttons">
        <button onclick="closeModal()">Cancel</button>
        <button class="add" onclick="addRepost()">Add Repost</button>
      </div>

    </div>
  </div>

  <script>

    const originalPosts = [
      "https://www.instagram.com/p/DatYgsVRMn0/",
      "https://www.instagram.com/p/Dbn6uG2Occv/",
      "https://www.instagram.com/p/Db35GnCSkG2/",
      "https://www.instagram.com/p/DZiRm29lPc2/",
      "https://www.instagram.com/p/DaiKfaNuw-Z/",
      "https://www.instagram.com/p/Db35yZVhEGo/",
      "https://www.instagram.com/p/DYTWGf7th0H/",
      "https://www.instagram.com/p/DZ84r4ounEG/",
      "https://www.instagram.com/p/Db24cW4M6XP/",
      "https://www.instagram.com/p/Db17PUYlWPl/"
    ];

    let savedPosts =
      JSON.parse(localStorage.getItem("maddiesReposts") || "[]");

    function getAllPosts() {
      return [...originalPosts, ...savedPosts];
    }

    function getEmbedUrl(url) {
      url = url.trim();

      if (!url.endsWith("/")) {
        url += "/";
      }

      return url + "embed/";
    }

    function renderPosts() {

      const grid = document.getElementById("grid");
      const posts = getAllPosts();

      grid.innerHTML = "";

      if (posts.length === 0) {
        grid.innerHTML =
          '<div class="empty">No reposts yet.</div>';
        return;
      }

      posts.forEach(function(url) {

        const article = document.createElement("article");
        article.className = "post";

        const iframe = document.createElement("iframe");

        iframe.src = getEmbedUrl(url);
        iframe.scrolling = "no";
        iframe.allowTransparency = true;

        article.appendChild(iframe);
        grid.appendChild(article);

      });
    }

    function openModal() {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("urlInput").focus();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      document.getElementById("urlInput").value = "";
    }

    function addRepost() {

      const input = document.getElementById("urlInput");
      const url = input.value.trim();

      if (!url) {
        alert("Paste an Instagram link first!");
        return;
      }

      if (!url.includes("instagram.com")) {
        alert("Please paste an Instagram link.");
        return;
      }

      savedPosts.push(url);

      localStorage.setItem(
        "maddiesReposts",
        JSON.stringify(savedPosts)
      );

      renderPosts();
      closeModal();
    }

    document.getElementById("modal").addEventListener("click", function(event) {
      if (event.target === this) {
        closeModal();
      }
    });

    renderPosts();

  </script>

</body>
</html>
```
