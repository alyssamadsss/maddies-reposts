<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things that spoke to me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff0f5;
      color: #4a3039;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      padding: 34px 20px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #5a3543;
    }

    .subtitle {
      margin: 7px 0 14px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: lowercase;
      color: #a66f82;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .add-button,
    .login-button,
    .logout-button {
      border: 1px solid #e5b8c7;
      background: #fff8fa;
      color: #8b5268;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: .2s;
    }

    .add-button:hover,
    .login-button:hover,
    .logout-button:hover {
      background: #f9dce6;
    }

    .feed {
      height: 760px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 18px 20px;
      border: 1px solid #eccbd6;
      border-radius: 22px;
      background: #fff8fa;
      box-shadow: 0 8px 28px rgba(150, 80, 105, .08);
      scrollbar-width: thin;
      scrollbar-color: #ddb0c1 transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .post {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #efdce2;
      min-width: 0;
    }

    .post iframe {
      display: block;
      width: 100%;
      min-height: 620px;
      border: 0;
    }

    .remove-button {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 248, 250, .95);
      color: #a34f70;
      font-family: Arial, sans-serif;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(80, 30, 50, .15);
    }

    .remove-button:hover {
      background: #f7d5e1;
    }

    .admin-mode .remove-button {
      display: block;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #b18494;
      font-family: Arial, sans-serif;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(91, 45, 61, .35);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #fff8fa;
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 15px 50px rgba(100, 45, 65, .18);
    }

    .modal-box h2 {
      margin: 0 0 8px;
      font-weight: 500;
      color: #5a3543;
    }

    .modal-box p {
      margin: 0 0 16px;
      color: #a66f82;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .url-input,
    .email-input,
    .password-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e5c1ce;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    .url-input:focus,
    .email-input:focus,
    .password-input:focus {
      border-color: #c98fa6;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .modal-buttons button {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid #e5b8c7;
      background: #ffffff;
      color: #7e4b60;
      cursor: pointer;
    }

    .modal-buttons .add {
      background: #c77f9b;
      color: white;
      border-color: #c77f9b;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #a66f82;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 12px;
      }

      .feed {
        height: 78vh;
        padding: 6px 10px 16px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .post iframe {
        min-height: 620px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <h1>things that spoke to me</h1>
      <div class="subtitle">maddie's reposts</div>

      <div class="button-row">

        <button
          class="login-button"
          id="loginButton"
          onclick="openLogin()">
          Admin Login
        </button>

        <button
          class="add-button"
          id="addButton"
          onclick="openAddModal()"
          style="display:none;">
          + Add Repost
        </button>

        <button
          class="logout-button"
          id="logoutButton"
          onclick="logout()"
          style="display:none;">
          Log Out
        </button>

      </div>

      <div class="status" id="status"></div>
    </header>

    <section class="feed">
      <div class="grid" id="grid"></div>
    </section>

  </main>

  <!-- LOGIN MODAL -->

  <div class="modal" id="loginModal">

    <div class="modal-box">

      <h2>Admin Login</h2>

      <p>
        Sign in to add or remove reposts.
      </p>

      <input
        id="emailInput"
        class="email-input"
        type="email"
        placeholder="Email">

      <input
        id="passwordInput"
        class="password-input"
        type="password"
        placeholder="Password">

      <div class="modal-buttons">
        <button onclick="closeLogin()">Cancel</button>
        <button class="add" onclick="login()">Log In</button>
      </div>

    </div>

  </div>

  <!-- ADD REPOST MODAL -->

  <div class="modal" id="addModal">

    <div class="modal-box">

      <h2>Add a repost</h2>

      <p>
        Paste the Instagram post or reel link below.
      </p>

      <input
        id="urlInput"
        class="url-input"
        type="text"
        placeholder="https://www.instagram.com/p/...">

      <div class="modal-buttons">
        <button onclick="closeAddModal()">Cancel</button>
        <button class="add" onclick="addRepost()">Add Repost</button>
      </div>

    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://jhdjzuneqtmtglindcia.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SadDNJrtj5XnMUDKB0vr4Q_NBgu1PXK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let isAdmin = false;

    function getEmbedUrl(url) {

      url = url.trim();

      if (!url.endsWith("/")) {
        url += "/";
      }

      return url + "embed/";
    }

    async function loadPosts() {

      const grid =
        document.getElementById("grid");

      grid.innerHTML =
        '<div class="empty">Loading reposts...</div>';

      const { data, error } =
        await supabaseClient
          .from("reposts")
          .select("id, url, created_at")
          .order("created_at", {
            ascending: false
          });

      if (error) {

        console.error(error);

        grid.innerHTML =
          '<div class="empty">Could not load reposts.</div>';

        return;
      }

      grid.innerHTML = "";

      if (!data || data.length === 0) {

        grid.innerHTML =
          '<div class="empty">Add your first repost ♡</div>';

        return;
      }

      data.forEach(function(post) {

        const article =
          document.createElement("article");

        article.className = "post";

        const iframe =
          document.createElement("iframe");

        iframe.src =
          getEmbedUrl(post.url);

        iframe.scrolling = "no";
        iframe.allowTransparency = true;

        const removeButton =
          document.createElement("button");

        removeButton.className =
          "remove-button";

        removeButton.innerHTML = "×";

        removeButton.title =
          "Remove repost";

        removeButton.onclick = function() {
          removeRepost(post.id);
        };

        article.appendChild(removeButton);
        article.appendChild(iframe);

        grid.appendChild(article);

      });

      updateAdminMode();

    }

    async function checkLogin() {

      const { data } =
        await supabaseClient.auth.getSession();

      isAdmin = !!data.session;

      updateAdminMode();

    }

    function updateAdminMode() {

      const loginButton =
        document.getElementById("loginButton");

      const addButton =
        document.getElementById("addButton");

      const logoutButton =
        document.getElementById("logoutButton");

      if (isAdmin) {

        loginButton.style.display = "none";
        addButton.style.display = "inline-block";
        logoutButton.style.display = "inline-block";

        document.body.classList.add("admin-mode");

      } else {

        loginButton.style.display = "inline-block";
        addButton.style.display = "none";
        logoutButton.style.display = "none";

        document.body.classList.remove("admin-mode");

      }

    }

    async function login() {

      const email =
        document.getElementById("emailInput")
          .value.trim();

      const password =
        document.getElementById("passwordInput")
          .value;

      if (!email || !password) {

        alert("Enter your email and password.");

        return;
      }

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        alert(error.message);

        return;
      }

      closeLogin();

      await checkLogin();

      await loadPosts();

    }

    async function logout() {

      await supabaseClient.auth.signOut();

      isAdmin = false;

      updateAdminMode();

      await loadPosts();

    }

    async function addRepost() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (!data.session) {

        alert("You need to log in first.");

        return;
      }

      const input =
        document.getElementById("urlInput");

      const url =
        input.value.trim();

      if (!url) {

        alert("Paste an Instagram link first!");

        return;
      }

      if (!url.includes("instagram.com")) {

        alert("Please paste an Instagram link.");

        return;
      }

      const { error } =
        await supabaseClient
          .from("reposts")
          .insert({
            url: url
          });

      if (error) {

        console.error(error);

        alert(
          "Could not add the repost. Check your permissions."
        );

        return;
      }

      closeAddModal();

      await loadPosts();

    }

    async function removeRepost(id) {

      if (!isAdmin) {

        alert("You need to be logged in.");

        return;
      }

      const confirmed =
        confirm("Remove this repost?");

      if (!confirmed) {
        return;
      }

      const { error } =
        await supabaseClient
          .from("reposts")
          .delete()
          .eq("id", id);

      if (error) {

        console.error(error);

        alert(
          "Could not remove the repost. Check your permissions."
        );

        return;
      }

      await loadPosts();

    }

    function openLogin() {

      document.getElementById("loginModal")
        .style.display = "flex";

      document.getElementById("emailInput")
        .focus();

    }

    function closeLogin() {

      document.getElementById("loginModal")
        .style.display = "none";

      document.getElementById("emailInput").value = "";
      document.getElementById("passwordInput").value = "";

    }

    function openAddModal() {

      document.getElementById("addModal")
        .style.display = "flex";

      document.getElementById("urlInput")
        .focus();

    }

    function closeAddModal() {

      document.getElementById("addModal")
        .style.display = "none";

      document.getElementById("urlInput").value = "";

    }

    document.getElementById("loginModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeLogin();
        }

      });

    document.getElementById("addModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeAddModal();
        }

      });

    supabaseClient.auth.onAuthStateChange(
      function() {
        checkLogin();
      }
    );

    checkLogin();
    loadPosts();

  </script>

</body>
</html>
```
