<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>my gallery ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --pink: #f5dce5;
  --pink-soft: #fff7fa;
  --pink-border: #efd5df;
  --text: #654f59;
  --muted: #a08b94;
  --white: #ffffff;
  --shadow: 0 7px 22px rgba(100, 70, 85, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% 0%, #fcebf1, transparent 28%),
    linear-gradient(#fffafd, #ffffff);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.page {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 28px clamp(10px, 3vw, 32px) 60px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 8px 10px 20px;
}

.header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-weight: 500;
  font-size: clamp(30px, 4vw, 46px);
}

.header p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .04em;
}

/* BUTTONS */

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.button {
  border: 1px solid var(--pink-border);
  border-radius: 999px;
  padding: 9px 16px;
  background: var(--pink);
  color: #765766;
  cursor: pointer;
  font-size: 13px;
  transition: transform .15s ease, box-shadow .15s ease;
}

.button:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 15px rgba(100,70,85,.08);
}

.button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.admin-only {
  display: none;
}

/* SECTION NAVIGATION */

.section-nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}

.section-tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--pink-border);
  border-radius: 999px;
  padding: 7px 9px 7px 13px;
  background: white;
  color: var(--muted);
  font-size: 12px;
}

.section-tab.active {
  background: var(--pink-soft);
  color: var(--text);
  border-color: #dcaabb;
}

.section-select-button {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
}

.delete-section-button {
  border: 0;
  width: 21px;
  height: 21px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: #b28c99;
  cursor: pointer;
  font-size: 15px;
  line-height: 21px;
}

.delete-section-button:hover {
  background: #f9e4eb;
  color: #9a536b;
}

/* SORT */

.sort-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-bottom: 25px;
  color: var(--muted);
  font-size: 12px;
}

.sort-row select {
  width: auto;
  min-width: 150px;
  padding: 7px 12px;
}

/* HEADING */

.section-heading {
  text-align: center;
  margin-bottom: 18px;
}

.section-heading h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 23px;
  font-weight: 500;
}

.section-heading p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* GALLERY */

.gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: start;
  gap: clamp(10px, 1.4vw, 18px);
  width: 100%;
}

.card {
  width: 100%;
  min-width: 0;
  background: var(--white);
  border: 1px solid rgba(239, 213, 223, .6);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  align-self: start;
}

.media {
  width: 100%;
  overflow: hidden;
  background: #fff;
}

.media img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  margin: 0 auto;
  cursor: zoom-in;
}

.media video {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  background: #000;
}

/* INFO */

.memory-info {
  padding: 11px 13px 13px;
}

.date {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 5px;
}

.location {
  color: #9b7784;
  font-size: 11px;
  margin-bottom: 6px;
}

.caption {
  font-family: Georgia, serif;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* DELETE MEMORY */

.card-actions {
  display: none;
  justify-content: flex-end;
  padding: 0 10px 10px;
}

body.admin-mode .card-actions {
  display: flex;
}

.delete-button {
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
}

.delete-button:hover {
  color: #9b596e;
}

/* EMPTY */

.empty {
  grid-column: 1 / -1;
  padding: 50px 20px;
  text-align: center;
  color: var(--muted);
  font-family: Georgia, serif;
}

/* MODALS */

.modal,
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(45, 30, 37, .58);
  backdrop-filter: blur(5px);
}

.modal.open,
.lightbox.open {
  display: flex;
}

.modal-box {
  position: relative;
  width: min(480px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 25px 80px rgba(0,0,0,.2);
}

.modal-box h2 {
  margin: 0 0 5px;
  font-family: Georgia, serif;
  font-weight: 500;
}

.modal-subtitle {
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 12px;
}

.close {
  position: absolute;
  top: 12px;
  right: 15px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: var(--pink-soft);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
}

/* FORM */

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--pink-border);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fffafb;
  color: var(--text);
  font: inherit;
  font-size: 13px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.submit {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 11px;
  background: var(--pink);
  color: #765766;
  cursor: pointer;
}

.submit:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  display: none;
  padding: 9px;
  margin-bottom: 14px;
  border-radius: 10px;
  background: var(--pink-soft);
  color: var(--muted);
  font-size: 12px;
}

/* LIGHTBOX */

.lightbox img {
  display: block;
  max-width: 94vw;
  max-height: 90vh;
  width: auto;
  height: auto;
  border-radius: 18px;
  box-shadow: 0 20px 80px rgba(0,0,0,.3);
}

.lightbox .close {
  position: fixed;
  top: 15px;
  right: 18px;
}

/* MOBILE */

@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 520px) {
  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .card {
    border-radius: 14px;
  }

  .memory-info {
    padding: 9px 10px 11px;
  }

  .caption {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<main class="page">

<header class="header">
  <h1>my gallery ♡</h1>
  <p>photos, videos &amp; little memories</p>
</header>

<div class="actions">

  <button class="button" id="adminButton">
    🔒 admin
  </button>

  <button class="button admin-only" id="logoutButton">
    log out
  </button>

  <button class="button admin-only" id="addMemoryButton">
    ＋ add a little memory
  </button>

  <button class="button admin-only" id="newSectionButton">
    ＋ new section
  </button>

</div>

<nav class="section-nav" id="sectionNav"></nav>

<div class="section-heading" id="sectionHeading"></div>

<div class="sort-row">

  <span>sort by</span>

  <select id="sortSelect">
    <option value="newest">newest first</option>
    <option value="oldest">oldest first</option>
    <option value="added">recently added</option>
  </select>

</div>

<section class="gallery" id="gallery">

  <div class="empty">
    loading memories ♡
  </div>

</section>

</main>


<!-- LOGIN -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <button class="close" data-close="loginModal">
      ×
    </button>

    <h2>admin ♡</h2>

    <p class="modal-subtitle">
      log in to manage your memories
    </p>

    <div class="status" id="loginStatus"></div>

    <div class="form-group">

      <label>Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com">

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="your password">

    </div>

    <button class="submit" id="loginSubmit">
      log in ♡
    </button>

  </div>

</div>


<!-- ADD MEMORY -->

<div class="modal" id="memoryModal">

  <div class="modal-box">

    <button class="close" data-close="memoryModal">
      ×
    </button>

    <h2>add a little memory ♡</h2>

    <p class="modal-subtitle">
      add a photo or video
    </p>

    <div class="form-group">

      <label>Photo or video</label>

      <input
        id="file"
        type="file"
        accept="image/*,video/*">

    </div>

    <div class="form-group">

      <label>Section</label>

      <select id="memorySection"></select>

    </div>

    <div class="form-group">

      <label>Date — optional</label>

      <input
        id="memoryDate"
        type="date">

    </div>

    <div class="form-group">

      <label>Location — optional</label>

      <input
        id="memoryLocation"
        type="text"
        placeholder="Toronto, Canada">

    </div>

    <div class="form-group">

      <label>Caption — optional</label>

      <textarea
        id="memoryCaption"
        placeholder="a little memory ♡"></textarea>

    </div>

    <button class="submit" id="saveMemory">
      add memory ♡
    </button>

  </div>

</div>


<!-- NEW SECTION -->

<div class="modal" id="sectionModal">

  <div class="modal-box">

    <button class="close" data-close="sectionModal">
      ×
    </button>

    <h2>new section ♡</h2>

    <p class="modal-subtitle">
      create a new album for your memories
    </p>

    <div class="form-group">

      <label>Section name</label>

      <input
        id="sectionName"
        placeholder="summer ♡">

    </div>

    <div class="form-group">

      <label>Subtitle — optional</label>

      <textarea
        id="sectionSubtitle"
        placeholder="sunny days & little adventures"></textarea>

    </div>

    <button class="submit" id="saveSection">
      create section ♡
    </button>

  </div>

</div>


<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

  <button class="close" id="closeLightbox">
    ×
  </button>

  <img id="lightboxImage" alt="">

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://jhdjzuneqtmtglindcia.supabase.co";

/*
  KEEP YOUR EXISTING WORKING KEY HERE.
*/
const SUPABASE_KEY =
  "sb_publishable_SadDNJrtj5XnMUDKB0vr4Q_NBgu1PXK";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ADMIN
   ========================================================= */

const ADMIN_UID =
  "d512046e-1639-4c5a-8143-8b5602bd03f0";


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;

let sections = [];

let activeSection = "all";

let currentSort = "newest";


/* =========================================================
   MODALS
   ========================================================= */

function openModal(id) {

  document
    .getElementById(id)
    .classList
    .add("open");

}


function closeModal(id) {

  document
    .getElementById(id)
    .classList
    .remove("open");

}


document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        closeModal(
          button.dataset.close
        );

      }
    );

  });


/* =========================================================
   ADMIN LOGIN
   ========================================================= */

document
  .getElementById("adminButton")
  .addEventListener(
    "click",
    () => {

      if (!currentUser) {

        openModal("loginModal");

      }

    }
  );


document
  .getElementById("loginSubmit")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const status =
        document
          .getElementById("loginStatus");

      const button =
        document
          .getElementById("loginSubmit");


      status.style.display =
        "none";


      if (!email || !password) {

        status.textContent =
          "Please enter your email and password ♡";

        status.style.display =
          "block";

        return;

      }


      button.disabled = true;

      button.textContent =
        "logging in...";


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      button.disabled = false;

      button.textContent =
        "log in ♡";


      if (error) {

        status.textContent =
          error.message;

        status.style.display =
          "block";

        return;

      }


      if (
        !data.user ||
        data.user.id !== ADMIN_UID
      ) {

        await supabaseClient
          .auth
          .signOut();

        status.textContent =
          "This account isn't the gallery admin ♡";

        status.style.display =
          "block";

        return;

      }


      currentUser =
        data.user;


      closeModal(
        "loginModal"
      );


      updateAdminUI();

      renderSectionNavigation();

    }
  );


/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      currentUser = null;

      updateAdminUI();

      renderSectionNavigation();

    }
  );


/* =========================================================
   ADMIN UI
   ========================================================= */

function updateAdminUI() {

  const isAdmin =
    Boolean(
      currentUser &&
      currentUser.id === ADMIN_UID
    );


  document.body.classList.toggle(
    "admin-mode",
    isAdmin
  );


  document
    .querySelectorAll(".admin-only")
    .forEach(element => {

      element.style.display =
        isAdmin
          ? "inline-block"
          : "none";

    });

}


/* =========================================================
   LOAD SECTIONS
   ========================================================= */

async function loadSections() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("sections")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Could not load sections:",
      error
    );

    sections = [];

  } else {

    sections =
      data || [];

  }


  renderSectionNavigation();

  renderSectionSelect();

}


/* =========================================================
   SECTION NAVIGATION
   ========================================================= */

function renderSectionNavigation() {

  const nav =
    document
      .getElementById(
        "sectionNav"
      );


  nav.innerHTML = "";


  /* ALL MEMORIES */

  const allTab =
    document.createElement(
      "div"
    );


  allTab.className =
    "section-tab" +
    (
      activeSection === "all"
        ? " active"
        : ""
    );


  const allButton =
    document.createElement(
      "button"
    );


  allButton.className =
    "section-select-button";


  allButton.textContent =
    "all memories ♡";


  allButton.addEventListener(
    "click",
    () => {

      activeSection =
        "all";

      renderSectionNavigation();

      loadGallery();

    }
  );


  allTab.appendChild(
    allButton
  );


  nav.appendChild(
    allTab
  );


  /* SECTIONS */

  sections
    .filter(
      section =>
        section.title
          .trim()
          .toLowerCase() !==
        "all memories ♡"
    )
    .forEach(
      section => {

        const tab =
          document.createElement(
            "div"
          );


        tab.className =
          "section-tab" +
          (
            activeSection === section.id
              ? " active"
              : ""
          );


        const selectButton =
          document.createElement(
            "button"
          );


        selectButton.className =
          "section-select-button";


        selectButton.textContent =
          section.title;


        selectButton.addEventListener(
          "click",
          () => {

            activeSection =
              section.id;

            renderSectionNavigation();

            loadGallery();

          }
        );


        tab.appendChild(
          selectButton
        );


        /*
          ADMIN DELETE BUTTON
        */

        if (
          currentUser &&
          currentUser.id === ADMIN_UID
        ) {

          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete-section-button";


          deleteButton.title =
            "Delete section";


          deleteButton.textContent =
            "×";


          deleteButton.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              deleteSection(
                section
              );

            }
          );


          tab.appendChild(
            deleteButton
          );

        }


        nav.appendChild(
          tab
        );

      }
    );

}


/* =========================================================
   DELETE SECTION
   ========================================================= */

async function deleteSection(section) {

  if (
    !currentUser ||
    currentUser.id !== ADMIN_UID
  ) {
    return;
  }


  const confirmed =
    confirm(
      `Delete "${section.title}"?\n\n` +
      `The photos and videos will NOT be deleted.\n\n` +
      `They will be moved to "all memories ♡".`
    );


  if (!confirmed) {
    return;
  }


  /*
    Move memories from this section
    into all memories.
  */

  const {
    error: moveError
  } =
    await supabaseClient
      .from("memories")
      .update({
        album: "all memories ♡"
      })
      .eq(
        "album",
        section.title
      );


  if (moveError) {

    alert(
      "Couldn't move the memories ♡\n\n" +
      moveError.message
    );

    console.error(
      moveError
    );

    return;
  }


  /*
    Delete section.
  */

  const {
    error: deleteError
  } =
    await supabaseClient
      .from("sections")
      .delete()
      .eq(
        "id",
        section.id
      );


  if (deleteError) {

    alert(
      "Couldn't delete the section ♡\n\n" +
      deleteError.message
    );

    console.error(
      deleteError
    );

    return;
  }


  if (
    activeSection ===
    section.id
  ) {

    activeSection =
      "all";

  }


  await loadSections();

  await loadGallery();

}


/* =========================================================
   SECTION SELECT
   ========================================================= */

function renderSectionSelect() {

  const select =
    document
      .getElementById(
        "memorySection"
      );


  select.innerHTML = "";


  const allOption =
    document.createElement(
      "option"
    );


  allOption.value =
    "all memories ♡";


  allOption.textContent =
    "all memories ♡";


  select.appendChild(
    allOption
  );


  sections
    .filter(
      section =>
        section.title
          .trim()
          .toLowerCase() !==
        "all memories ♡"
    )
    .forEach(
      section => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          section.title;


        option.textContent =
          section.title;


        select.appendChild(
          option
        );

      }
    );

}


/* =========================================================
   HEADING
   ========================================================= */

function updateHeading() {

  const heading =
    document
      .getElementById(
        "sectionHeading"
      );


  heading.innerHTML = "";


  if (
    activeSection ===
    "all"
  ) {

    heading.innerHTML = `
      <h2>all memories ♡</h2>
      <p>photos, videos & little memories</p>
    `;

    return;
  }


  const section =
    sections.find(
      item =>
        item.id ===
        activeSection
    );


  if (!section) {
    return;
  }


  const title =
    document.createElement(
      "h2"
    );


  title.textContent =
    section.title;


  heading.appendChild(
    title
  );


  if (
    section.subtitle
  ) {

    const subtitle =
      document.createElement(
        "p"
      );


    subtitle.textContent =
      section.subtitle;


    heading.appendChild(
      subtitle
    );

  }

}


/* =========================================================
   DATE SORTING
   =========================================================

   IMPORTANT:

   Dates such as:

   2025-01-02
   2025-08-14
   2026-03-10

   are converted to numbers:

   20250102
   20250814
   20260310

   This makes the sorting reliable and
   avoids timezone problems.
   ========================================================= */

function dateNumber(value) {

  if (!value) {
    return null;
  }


  const cleaned =
    String(value)
      .trim()
      .replace(/-/g, "")
      .replace(/T.*$/, "");


  const number =
    Number(
      cleaned
    );


  if (
    !Number.isFinite(number)
  ) {

    return null;

  }


  return number;

}


function sortMemories(memories) {

  return [...memories].sort(
    (a, b) => {

      /*
        Recently added
      */

      if (
        currentSort ===
        "added"
      ) {

        const addedA =
          new Date(
            a.created_at || 0
          ).getTime();


        const addedB =
          new Date(
            b.created_at || 0
          ).getTime();


        return addedB -
          addedA;

      }


      /*
        Actual memory dates
      */

      const dateA =
        dateNumber(
          a.memory_date
        );


      const dateB =
        dateNumber(
          b.memory_date
        );


      /*
        Memories without dates
        go to the bottom.
      */

      if (
        dateA === null &&
        dateB === null
      ) {

        return 0;

      }


      if (
        dateA === null
      ) {

        return 1;

      }


      if (
        dateB === null
      ) {

        return -1;

      }


      /*
        OLDEST FIRST
      */

      if (
        currentSort ===
        "oldest"
      ) {

        return dateA -
          dateB;

      }


      /*
        NEWEST FIRST
      */

      return dateB -
        dateA;

    }
  );

}


/* =========================================================
   SORT DROPDOWN
   ========================================================= */

document
  .getElementById(
    "sortSelect"
  )
  .addEventListener(
    "change",
    event => {

      currentSort =
        event.target.value;

      loadGallery();

    }
  );


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value) {

  if (!value) {
    return "";
  }


  /*
    Use the date components directly
    instead of adding a timezone-sensitive
    Date conversion.
  */

  const parts =
    String(value)
      .split("-");


  if (
    parts.length !== 3
  ) {

    return value;

  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]);


  const day =
    Number(parts[2]);


  if (
    !year ||
    !month ||
    !day
  ) {

    return value;

  }


  const date =
    new Date(
      year,
      month - 1,
      day
    );


  return date.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

}


/* =========================================================
   MEDIA URL
   ========================================================= */

function getMediaURL(path) {

  if (!path) {
    return "";
  }


  return supabaseClient
    .storage
    .from("gallery")
    .getPublicUrl(path)
    .data
    .publicUrl;

}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function loadGallery() {

  updateHeading();


  const gallery =
    document
      .getElementById(
        "gallery"
      );


  gallery.innerHTML = `
    <div class="empty">
      loading memories ♡
    </div>
  `;


  let query =
    supabaseClient
      .from("memories")
      .select("*");


  /*
    If a specific section is selected,
    find its name and filter memories.
  */

  if (
    activeSection !==
    "all"
  ) {

    const section =
      sections.find(
        item =>
          item.id ===
          activeSection
      );


    if (section) {

      query =
        query.eq(
          "album",
          section.title
        );

    }

  }


  const {
    data,
    error
  } =
    await query;


  if (error) {

    console.error(
      "Gallery error:",
      error
    );


    gallery.innerHTML = `
      <div class="empty">
        couldn't load memories ♡
      </div>
    `;

    return;
  }


  gallery.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    gallery.innerHTML = `
      <div class="empty">
        no memories here yet ♡
      </div>
    `;

    return;
  }


  /*
    THIS IS WHERE THE ACTUAL SORT
    HAPPENS BEFORE CARDS ARE CREATED.
  */

  const sorted =
    sortMemories(data);


  sorted.forEach(
    item => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const url =
        getMediaURL(
          item.file_path
        );


      /* PHOTO */

      if (
        item.type ===
        "image"
      ) {

        const image =
          document.createElement(
            "img"
          );


        image.loading =
          "lazy";


        image.decoding =
          "async";


        image.src =
          url;


        image.alt =
          item.caption &&
          item.caption.trim()
            ? item.caption
            : "Gallery photo";


        image.addEventListener(
          "click",
          () => {

            const lightboxImage =
              document
                .getElementById(
                  "lightboxImage"
                );


            lightboxImage.src =
              url;


            lightboxImage.alt =
              image.alt;


            openModal(
              "lightbox"
            );

          }
        );


        media.appendChild(
          image
        );

      }


      /* VIDEO */

      else if (
        item.type ===
        "video"
      ) {

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;


        video.preload =
          "metadata";


        video.playsInline =
          true;


        video.src =
          url;


        media.appendChild(
          video
        );

      }


      card.appendChild(
        media
      );


      /* INFO */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "memory-info";


      /*
        DATE
      */

      if (
        item.memory_date
      ) {

        const date =
          document.createElement(
            "div"
          );


        date.className =
          "date";


        date.textContent =
          formatDate(
            item.memory_date
          );


        info.appendChild(
          date
        );

      }


      /*
        LOCATION
      */

      if (
        item.location &&
        item.location.trim()
      ) {

        const location =
          document.createElement(
            "div"
          );


        location.className =
          "location";


        location.textContent =
          "📍 " +
          item.location;


        info.appendChild(
          location
        );

      }


      /*
        CAPTION
      */

      if (
        item.caption &&
        item.caption.trim()
      ) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "caption";


        caption.textContent =
          item.caption;


        info.appendChild(
          caption
        );

      }


      if (
        info.children.length
      ) {

        card.appendChild(
          info
        );

      }


      /*
        ADMIN DELETE MEMORY
      */

      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "card-actions";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-button";


      deleteButton.textContent =
        "delete";


      deleteButton.addEventListener(
        "click",
        () =>
          deleteMemory(
            item
          )
      );


      actions.appendChild(
        deleteButton
      );


      card.appendChild(
        actions
      );


      gallery.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   DELETE MEMORY
   ========================================================= */

async function deleteMemory(item) {

  if (
    !currentUser ||
    currentUser.id !== ADMIN_UID
  ) {

    return;
  }


  if (
    !confirm(
      "Delete this memory? ♡"
    )
  ) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("memories")
      .delete()
      .eq(
        "id",
        item.id
      );


  if (error) {

    alert(
      "Couldn't delete the memory ♡\n\n" +
      error.message
    );

    return;
  }


  if (
    item.file_path
  ) {

    await supabaseClient
      .storage
      .from("gallery")
      .remove([
        item.file_path
      ]);

  }


  await loadGallery();

}


/* =========================================================
   ADD MEMORY
   ========================================================= */

document
  .getElementById(
    "addMemoryButton"
  )
  .addEventListener(
    "click",
    () => {

      renderSectionSelect();

      openModal(
        "memoryModal"
      );

    }
  );


document
  .getElementById(
    "saveMemory"
  )
  .addEventListener(
    "click",
    async () => {

      if (
        !currentUser ||
        currentUser.id !== ADMIN_UID
      ) {

        return;
      }


      const file =
        document
          .getElementById(
            "file"
          )
          .files[0];


      if (!file) {

        alert(
          "Please choose a photo or video ♡"
        );

        return;
      }


      const button =
        document
          .getElementById(
            "saveMemory"
          );


      button.disabled =
        true;


      button.textContent =
        "saving... ♡";


      const type =
        file.type.startsWith(
          "video/"
        )
          ? "video"
          : "image";


      const cleanName =
        file.name
          .normalize("NFKD")
          .replace(
            /[^\w.\- ]/g,
            ""
          )
          .replace(
            /\s+/g,
            "-"
          );


      const path =
        `${crypto.randomUUID()}-${cleanName}`;


      /*
        UPLOAD
      */

      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("gallery")
          .upload(
            path,
            file,
            {
              contentType:
                file.type,

              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (uploadError) {

        alert(
          "Upload failed ♡\n\n" +
          uploadError.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;
      }


      /*
        GET FORM DATA
      */

      const memoryDate =
        document
          .getElementById(
            "memoryDate"
          )
          .value;


      const location =
        document
          .getElementById(
            "memoryLocation"
          )
          .value
          .trim();


      const album =
        document
          .getElementById(
            "memorySection"
          )
          .value;


      const caption =
        document
          .getElementById(
            "memoryCaption"
          )
          .value
          .trim();


      /*
        SAVE DATABASE RECORD

        memory_date is the important
        column used by the sorting.
      */

      const {
        error:
          dbError
      } =
        await supabaseClient
          .from("memories")
          .insert({

            type,

            file_path:
              path,

            album,

            memory_date:
              memoryDate ||
              null,

            location,

            caption

          });


      if (dbError) {

        await supabaseClient
          .storage
          .from("gallery")
          .remove([
            path
          ]);


        alert(
          "Couldn't save the memory ♡\n\n" +
          dbError.message
        );

        button.disabled =
          false;

        button.textContent =
          "add memory ♡";

        return;
      }


      /*
        CLEAR FORM
      */

      document
        .getElementById(
          "file"
        )
        .value = "";


      document
        .getElementById(
          "memoryDate"
        )
        .value = "";


      document
        .getElementById(
          "memoryLocation"
        )
        .value = "";


      document
        .getElementById(
          "memoryCaption"
        )
        .value = "";


      closeModal(
        "memoryModal"
      );


      button.disabled =
        false;


      button.textContent =
        "add memory ♡";


      await loadGallery();

    }
  );


/* =========================================================
   NEW SECTION
   ========================================================= */

document
  .getElementById(
    "newSectionButton"
  )
  .addEventListener(
    "click",
    () => {

      openModal(
        "sectionModal"
      );

    }
  );


document
  .getElementById(
    "saveSection"
  )
  .addEventListener(
    "click",
    async () => {

      if (
        !currentUser ||
        currentUser.id !== ADMIN_UID
      ) {

        return;
      }


      const title =
        document
          .getElementById(
            "sectionName"
          )
          .value
          .trim();


      const subtitle =
        document
          .getElementById(
            "sectionSubtitle"
          )
          .value
          .trim();


      if (!title) {

        alert(
          "Please give your section a name ♡"
        );

        return;
      }


      if (
        title
          .toLowerCase() ===
        "all memories ♡"
      ) {

        alert(
          '"all memories ♡" is already your default section.'
        );

        return;
      }


      const button =
        document
          .getElementById(
            "saveSection"
          );


      button.disabled =
        true;


      button.textContent =
        "creating... ♡";


      const {
        error
      } =
        await supabaseClient
          .from("sections")
          .insert({

            title,

            subtitle

          });


      button.disabled =
        false;


      button.textContent =
        "create section ♡";


      if (error) {

        alert(
          "Couldn't create the section ♡\n\n" +
          error.message
        );

        return;
      }


      document
        .getElementById(
          "sectionName"
        )
        .value = "";


      document
        .getElementById(
          "sectionSubtitle"
        )
        .value = "";


      closeModal(
        "sectionModal"
      );


      await loadSections();

    }
  );


/* =========================================================
   LIGHTBOX
   ========================================================= */

document
  .getElementById(
    "closeLightbox"
  )
  .addEventListener(
    "click",
    () => {

      closeModal(
        "lightbox"
      );

      document
        .getElementById(
          "lightboxImage"
        )
        .src = "";

    }
  );


document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "lightbox"
      ) {

        closeModal(
          "lightbox"
        );

        document
          .getElementById(
            "lightboxImage"
          )
          .src = "";

      }

    }
  );


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .querySelectorAll(
          ".modal.open"
        )
        .forEach(
          modal => {

            modal.classList
              .remove("open");

          }
        );

    }

  }
);


/* =========================================================
   START
   ========================================================= */

async function start() {

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  currentUser =
    data.session?.user ||
    null;


  if (
    currentUser &&
    currentUser.id !== ADMIN_UID
  ) {

    await supabaseClient
      .auth
      .signOut();

    currentUser =
      null;

  }


  updateAdminUI();

  await loadSections();

  await loadGallery();

}


start();

</script>
