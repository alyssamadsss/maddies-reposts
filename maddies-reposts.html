<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>things that spoke to me</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #faf8f7;
      color: #2f2a2a;
      font-family: Georgia, "Times New Roman", serif;
    }
    body { padding: 34px 20px; }
    .page { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 7px 0 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: lowercase;
      color: #8a7777;
    }
    .feed {
      height: 760px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 18px 20px;
      border: 1px solid #e7dfdd;
      border-radius: 22px;
      background: #fffdfc;
      box-shadow: 0 8px 28px rgba(55, 40, 40, .06);
      scrollbar-width: thin;
      scrollbar-color: #cbbdbc transparent;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }
    .post {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #eee7e5;
      min-width: 0;
    }
    .post iframe {
      display: block;
      width: 100%;
      min-height: 620px;
      border: 0;
    }
    @media (max-width: 700px) {
      body { padding: 24px 12px; }
      .feed { height: 78vh; padding: 6px 10px 16px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .post iframe { min-height: 620px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>things that spoke to me</h1>
      <div class="subtitle">maddie's reposts</div>
    </header>

    <section class="feed">
      <div class="grid">
        <article class="post">
          <iframe src="https://www.instagram.com/p/DatYgsVRMn0/embed" scrolling="no" allowtransparency="true"></iframe>
        </article>

        </article>

        </article>

        </article>

</body>
</html>
